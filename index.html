<!DOCTYPE html>
<html>
<head>
    <title>Locations</title>
    <script src="https://unpkg.com/ag-grid-community/dist/ag-grid-community.min.noStyle.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/ag-grid-community/dist/styles/ag-grid.css">
    <link rel="stylesheet" href="https://unpkg.com/ag-grid-community/dist/styles/ag-theme-balham.css">
</head>
<body>
    <style>
        #data-table {
            height: 500px;
            width: 100%;
        }
    </style>
    <h1>Locations</h1>
    <div id="data-table" class="ag-theme-balham"></div>

    <script type="text/javascript" charset="utf-8">
        // Point this at your deployed Worker, e.g.
        // 'https://directory-api.<your-subdomain>.workers.dev/locations'
        const API_URL = 'http://localhost:8787/locations';

        const columnDefs = [
            { field: 'name', filter: 'agTextColumnFilter' },
            {
                field: 'categories',
                filter: 'agTextColumnFilter',
                // categories arrives as an array (e.g. ["Food/Drink", "Music"]) — join for display
                valueFormatter: (params) => (params.value || []).join(', '),
                // let the built-in text filter match against the joined string too
                filterValueGetter: (params) => (params.data.categories || []).join(', '),
            },
            { field: 'address', filter: 'agTextColumnFilter' },
            { field: 'website', filter: 'agTextColumnFilter' },
        ];

        const gridOptions = {
            defaultColDef: {
                sortable: true,
                filter: 'agTextColumnFilter',
                resizable: true
            },
            pagination: true,
            columnDefs: columnDefs,
            onGridReady: (event) => { renderDataInTheTable(event.api); }
        };

        const eGridDiv = document.getElementById('data-table');
        new Grid(eGridDiv, gridOptions);

        function renderDataInTheTable(api) {
            fetch("https://directory-api.wikiwoo.workers.dev")
                .then((response) => response.json())
                .then((data) => {
                    // API already returns { id, name, address, website, categories: [...] }
                    api.setRowData(data);
                    api.sizeColumnsToFit();
                })
                .catch((err) => {
                    console.error('Failed to load data:', err);
                });
        }
    </script>
</body>
</html>
