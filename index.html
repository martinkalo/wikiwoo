<!DOCTYPE html>
<html>
<head>
    <title>wikiwoo</title>
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@33/dist/ag-grid-community.min.js"></script>
</head>
<body>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        #data-table {
            height: 500px;
            width: 100%;
        }
    </style>
    <center><h1>wikiwoo</h1></center>
    <div id="data-table"></div>

    <script type="text/javascript" charset="utf-8">
        const API_URL = 'https://directory-api.wikiwoo.workers.dev/locations';

        // Custom checkbox filter for the `categories` column.
        // ag-grid Community doesn't include the built-in Set Filter (that's
        // Enterprise-only), so this is a small hand-rolled equivalent: one
        // checkbox per unique category, and a row passes if it has ANY of
        // the checked categories.
        class CategoryCheckboxFilter {
            init(params) {
                this.params = params;
                this.selected = new Set();

                this.eGui = document.createElement('div');
                this.eGui.style.padding = '10px';
                this.eGui.style.minWidth = '160px';
                this.checkboxes = {};

                const hint = document.createElement('div');
                hint.style.fontSize = '11px';
                hint.style.color = '#888';
                hint.style.marginBottom = '6px';
                this.eGui.appendChild(hint);

                // Collect every unique category currently in the grid's data
                const allCategories = new Set();
                params.api.forEachNode((node) => {
                    (node.data.categories || []).forEach((c) => allCategories.add(c));
                });

                [...allCategories].sort().forEach((cat) => {
                    const label = document.createElement('label');
                    label.style.display = 'block';
                    label.style.marginBottom = '4px';
                    label.style.cursor = 'pointer';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.value = cat;
                    checkbox.style.marginRight = '6px';
                    checkbox.addEventListener('change', () => {
                        if (checkbox.checked) {
                            this.selected.add(cat);
                        } else {
                            this.selected.delete(cat);
                        }
                        this.params.filterChangedCallback();
                    });

                    label.appendChild(checkbox);
                    label.appendChild(document.createTextNode(cat));
                    this.eGui.appendChild(label);
                    this.checkboxes[cat] = checkbox;
                });
            }

            getGui() {
                return this.eGui;
            }

            doesFilterPass(params) {
                if (this.selected.size === 0) return true;
                const rowCategories = params.data.categories || [];
                return [...this.selected].every((c) => rowCategories.includes(c));
            }

            isFilterActive() {
                return this.selected.size > 0;
            }

            getModel() {
                if (this.selected.size === 0) return null;
                return { values: [...this.selected] };
            }

            setModel(model) {
                this.selected = new Set(model ? model.values : []);
                Object.entries(this.checkboxes).forEach(([cat, checkbox]) => {
                    checkbox.checked = this.selected.has(cat);
                });
            }
        }

        const columnDefs = [
            { field: 'name', filter: 'agTextColumnFilter' },
            {
                field: 'categories',
                filter: CategoryCheckboxFilter,
                // categories arrives as an array (e.g. ["Food/Drink", "Music"]) — join for display
                valueFormatter: (params) => (params.value || []).join(', '),
            },
            { field: 'address', filter: 'agTextColumnFilter' },
            { field: 'website', filter: 'agTextColumnFilter' },
        ];

        // Plain, no-frills look — default system font, square corners,
        // thin gray borders, white background. No custom brand color.
        const myTheme = agGrid.themeQuartz.withParams({
            accentColor: "#0000EE",
            backgroundColor: "#FFFFFF",
            foregroundColor: "#000000",
            borderColor: "#999999",
            borderRadius: 0,
            wrapperBorderRadius: 0,
            fontFamily: "Arial, Helvetica, sans-serif",
            headerFontFamily: "Arial, Helvetica, sans-serif",
            fontSize: 13,
            headerFontSize: 13,
            headerFontWeight: "normal",
            headerBackgroundColor: "#EEEEEE",
            headerTextColor: "#000000",
            rowHoverColor: "#F0F0F0",
            spacing: 6,
        });

        const gridOptions = {
            theme: myTheme,
            defaultColDef: {
                sortable: true,
                filter: 'agTextColumnFilter',
                resizable: true
            },
            pagination: true,
            columnDefs: columnDefs,
            rowData: [],
        };

        const eGridDiv = document.getElementById('data-table');
        const gridApi = agGrid.createGrid(eGridDiv, gridOptions);

        // Keep track of the last data we rendered so we only touch the grid
        // when something actually changed (avoids unnecessary re-renders/
        // scroll jumps every poll).
        let lastDataJson = null;

        renderDataInTheTable(gridApi);
        setInterval(() => renderDataInTheTable(gridApi), 8000); // poll every 8s

        function renderDataInTheTable(api) {
            fetch(API_URL)
                .then((response) => response.json())
                .then((data) => {
                    const dataJson = JSON.stringify(data);
                    if (dataJson === lastDataJson) return; // nothing changed
                    lastDataJson = dataJson;

                    // API already returns { id, name, address, website, categories: [...] }
                    api.setGridOption('rowData', data);
                    api.sizeColumnsToFit();
                })
                .catch((err) => {
                    console.error('Failed to load data:', err);
                });
        }
    </script>
</body>
</html>
